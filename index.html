<!doctype html>
<!-- Moreland Games standalone demo. Open in any modern browser. No server, no network. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15110d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Moreland Games: original arcade games for every age. Play Unlikely Flyers as a turkey, a flying pig, a penguin, or a bull.">
<title>Moreland Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c0302b'/%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='none' stroke='%23f2c25a' stroke-width='2'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-weight='700' font-size='19' text-anchor='middle' fill='%23fff4dc'%3EM%3C/text%3E%3C/svg%3E">
<style>:root{--ink:#15110d;--ink2:#211a13;--cream:#fbf4e6;--muted:#cdbfa8;--gold:#f2b544;--gold2:#c98a1c;--red:#d63c36;--line:rgba(255,240,210,.14);
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
 --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html.in-game,html.in-game body{overflow:hidden;height:100%;overscroll-behavior:none;position:fixed;inset:0;width:100%}
a{color:inherit}
#app{min-height:100vh}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 26px;font:700 1rem/1 var(--sans);letter-spacing:.01em;text-decoration:none;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease;white-space:nowrap}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:linear-gradient(180deg,#ffcd5e,#e9a326);color:#2a1a04;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 24px rgba(233,163,38,.35),0 2px 0 #a8700f}
.btn.primary:hover{box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 12px 30px rgba(233,163,38,.5),0 2px 0 #a8700f}
.btn.ghost{background:rgba(255,248,235,.12);color:var(--cream);box-shadow:0 0 0 1px rgba(255,240,210,.35) inset;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.ghost:hover{background:rgba(255,248,235,.2)}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:3px solid #fff;outline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:0;background:rgba(22,15,8,.42);color:#fff8ec;font:700 .92rem/1 var(--sans);text-decoration:none;cursor:pointer;backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 0 0 1px rgba(255,240,210,.22) inset,0 6px 18px rgba(0,0,0,.18)}
.chip:hover{background:rgba(22,15,8,.6)}
.chip svg{width:20px;height:20px}
.chip.icon{width:42px;padding:0;justify-content:center}
.chip .x{display:none}.chip.off .x{display:inline}.chip.off .w1{display:none}
.eyebrow,.num{margin:0 0 10px;font:800 .74rem/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
/* ---------- hub ---------- */
.hub{background:var(--ink)}
.nav{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + var(--sat)) calc(clamp(18px,4vw,56px) + var(--sar)) 0 calc(clamp(18px,4vw,56px) + var(--sal))}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font:800 .95rem/1 var(--sans);letter-spacing:.24em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.brand b{font-weight:800;color:var(--gold);margin-left:.4em}
.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(160deg,#e8524a,#a8201f);box-shadow:0 0 0 2px #f2c25a inset,0 6px 16px rgba(0,0,0,.3);font:900 1.15rem/1 var(--serif);letter-spacing:0;color:#fff4dc}
.banner{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden}
.banner canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(18,10,4,.72) 0%,rgba(18,10,4,.42) 34%,rgba(18,10,4,0) 62%),linear-gradient(0deg,rgba(18,10,4,.7) 0%,rgba(18,10,4,0) 38%),linear-gradient(180deg,rgba(18,10,4,.35),rgba(18,10,4,0) 18%)}
.banner-copy{position:absolute;left:calc(clamp(18px,4vw,56px) + var(--sal));bottom:calc(clamp(28px,8vh,88px) + var(--sab));max-width:600px;padding-right:18px}
.banner h1{margin:0;font:700 clamp(3rem,7.4vw,6.2rem)/.95 var(--serif);letter-spacing:-.025em;color:#fffaf0;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.tag{margin:18px 0 28px;font-size:clamp(1.05rem,1.6vw,1.28rem);line-height:1.5;color:#f4e8d2;max-width:30em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.lineup{background:radial-gradient(1200px 500px at 80% 0%,#2a2016 0%,var(--ink) 60%);padding:clamp(56px,9vw,120px) 0}
.wrap{width:min(1240px,100% - 2*clamp(18px,4vw,56px));margin:0 auto}
.lineup-head h2{margin:0 0 36px;font:700 clamp(2rem,4vw,3.2rem)/1.05 var(--serif);letter-spacing:-.02em}
.card{display:grid;grid-template-columns:1.25fr 1fr;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#2a2118,#1d1610);box-shadow:0 0 0 1px var(--line) inset,0 30px 80px rgba(0,0,0,.45)}
.card .art{position:relative;display:block;min-height:360px;aspect-ratio:16/10}
.card .art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.card .copy{padding:clamp(24px,3.4vw,48px)}
.card h3,.band-copy h3{margin:0 0 10px;font:700 clamp(2rem,3.4vw,2.8rem)/1 var(--serif);letter-spacing:-.02em}
.lead{margin:0 0 14px;font-size:1.18rem;font-weight:600;color:#fff4e0}
.copy p:not(.num):not(.lead),.band-copy p:not(.num):not(.lead){color:var(--muted);line-height:1.6;margin:0 0 18px}
.facts{list-style:none;padding:0;margin:0 0 26px;display:flex;flex-wrap:wrap;gap:8px}
.facts li{padding:8px 12px;border-radius:999px;background:rgba(255,240,210,.08);box-shadow:0 0 0 1px var(--line) inset;font-size:.86rem;font-weight:600;color:#f1e4cc}
.pill{position:absolute;top:18px;left:18px;padding:8px 12px;border-radius:999px;background:rgba(18,12,6,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font:800 .7rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#fff}
.pill.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#6fe08a;margin-right:8px;box-shadow:0 0 10px #6fe08a;vertical-align:1px}
.soon-band{position:relative;background:var(--ink);overflow:hidden}
.band-art{position:relative;width:100%;aspect-ratio:16/9;max-height:88vh;overflow:hidden}
.soon-band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.08) translate(-1%,-1%)}}
.band-scrim{position:absolute;inset:0;background:linear-gradient(0deg,var(--ink) 0%,rgba(21,17,13,.55) 14%,rgba(21,17,13,0) 34%),linear-gradient(180deg,var(--ink) 0%,rgba(21,17,13,0) 12%)}
.band-art .pill{top:auto;bottom:clamp(60px,10%,120px);left:calc(clamp(18px,4vw,56px) + var(--sal));background:var(--gold);color:#2a1a04;backdrop-filter:none;font-size:.78rem;padding:10px 14px}
.band-copy{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(20px,5vw,72px);margin-top:-40px;padding-bottom:clamp(56px,8vw,110px)}
.band-copy h3{font-size:clamp(2.4rem,4.6vw,3.8rem)}
@media (max-width:860px){.band-copy{grid-template-columns:1fr;gap:0;margin-top:-10px}.band-art{aspect-ratio:4/3}.soon-band img{object-position:50% 50%}}
.foot{padding:28px 0 calc(28px + var(--sab));color:#9c8c74;font-size:.9rem}
.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:860px){.card{grid-template-columns:1fr}.card .art{min-height:0}
 .scrim{background:linear-gradient(0deg,rgba(18,10,4,.88) 0%,rgba(18,10,4,.55) 40%,rgba(18,10,4,0) 70%),linear-gradient(180deg,rgba(18,10,4,.45),rgba(18,10,4,0) 22%)}
.brand{font-size:.8rem;letter-spacing:.2em}.nav .chip .lbl{display:none}.nav .chip{width:42px;padding:0;justify-content:center}}
/* ---------- game ---------- */
.uf{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#d9a46c;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage{position:absolute;inset:0;outline:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + var(--sat)) calc(16px + var(--sar)) 0 calc(16px + var(--sal));pointer-events:none}
.topbar>*{pointer-events:auto}.tb-r{display:flex;gap:10px}
.score{position:absolute;left:50%;top:calc(max(64px,9vh) + var(--sat));transform:translateX(-50%);font:900 clamp(3.4rem,9vh,5.6rem)/1 var(--sans);color:#fff;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 #6a3a10,0 -2px 0 #6a3a10,2px 0 0 #6a3a10,-2px 0 0 #6a3a10,0 10px 28px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.score.show{opacity:1}.score.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}
.hint{position:absolute;left:50%;bottom:calc(max(120px,22vh) + var(--sab));transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:999px;background:rgba(22,15,8,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff8ec;font-weight:700;font-size:1rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s}
.hint.show{opacity:1;animation:bob 1.4s ease-in-out infinite}
.tap{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(242,181,68,.7);animation:ping 1.2s infinite}
@keyframes ping{to{box-shadow:0 0 0 14px rgba(242,181,68,0)}}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
.panel{position:absolute;left:50%;top:50%;width:min(470px,calc(100vw - 28px));max-height:calc(100dvh - 90px);overflow:auto;transform:translate(-50%,-46%) scale(.98);opacity:0;visibility:hidden;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.2),visibility 0s .3s;padding:26px 24px 22px;border-radius:28px;background:linear-gradient(180deg,rgba(255,250,240,.95),rgba(249,239,220,.94));color:#2a1d10;text-align:center;box-shadow:0 0 0 1px rgba(255,255,255,.7) inset,0 30px 80px rgba(30,15,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel:not(.show){pointer-events:none}
.panel.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.2)}
.panel .num{color:#b0771a;margin-bottom:8px}
.panel .title{margin:0;font:700 2.3rem/1 var(--serif);letter-spacing:-.02em;color:#24170b}
.panel .sub{margin:10px 0 16px;color:#6a5a44;font-size:.98rem;line-height:1.45}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.tile{appearance:none;-webkit-appearance:none;border:0;border-radius:18px;padding:8px 4px 10px;background:#fff;box-shadow:0 0 0 1px rgba(80,50,10,.12) inset,0 4px 12px rgba(80,50,10,.08);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--sans);color:#2a1d10;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px)}
.tile canvas{width:100%;aspect-ratio:1.15;display:block}
.tile .tn{font-weight:800;font-size:.84rem}.tile .tb{font-size:.68rem;color:#8a7658;line-height:1.2;min-height:2.4em}
.tile[aria-pressed=true]{background:linear-gradient(180deg,#fff8e6,#ffefc8);box-shadow:0 0 0 2.5px #e9a326 inset,0 8px 20px rgba(233,163,38,.3)}
.tiles.mini .tile{padding:6px 2px 8px;border-radius:14px}.tiles.mini .tn{font-size:.72rem}
.wide{width:100%;padding:16px}
.meta{margin:12px 0 0;color:#7a6a52;font-size:.9rem}.meta b{color:#2a1d10}
.ribbon-box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:104px;margin:10px 0 4px}
.rib-name{font:800 .78rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#8a5a10;margin-top:2px}
.rib-none{padding:14px 18px;border-radius:16px;background:rgba(120,80,20,.08);color:#6a5a44}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.stats div{padding:12px;border-radius:18px;background:#fff;box-shadow:0 0 0 1px rgba(80,50,10,.1) inset}
.stats span{display:block;font:800 .68rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#9a8566;margin-bottom:6px}
.stats strong{font:700 2.4rem/1 var(--serif);font-variant-numeric:tabular-nums;color:#24170b}
.newbest{display:none;margin:6px auto 4px;width:fit-content;padding:7px 14px;border-radius:999px;background:linear-gradient(180deg,#ffcd5e,#e9a326);color:#2a1a04;font:800 .76rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.newbest.show{display:block;animation:pop2 .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop2{from{transform:scale(.6);opacity:0}}
.row{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-top:14px}
.panel .btn.ghost{background:#fff;color:#2a1d10;box-shadow:0 0 0 1px rgba(80,50,10,.18) inset;backdrop-filter:none}
.swap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}.swap>div{overflow:hidden;margin:0}
.swap.open{grid-template-rows:1fr}.swap.open>div{margin-top:12px}
@media (max-height:620px){.panel{padding:16px 18px}.panel .title{font-size:1.8rem}.tile .tb{display:none}.ribbon-box{min-height:70px}}
@media (prefers-reduced-motion:reduce){.soon-band img,.hint.show{animation:none}.panel{transition:none}}
</style></head>

<script>
"use strict";
// ---------- Moreland pixel rasterizer (original) ----------
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+0.5)/16-0.5);
function hexRGB(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function pack(r,g,b,a=255){return((a<<24)|(b<<16)|(g<<8)|r)>>>0;}
function P(h){const c=hexRGB(h);return pack(c[0],c[1],c[2]);}
function mixHex(a,b,t){const A=hexRGB(a),B=hexRGB(b);const f=i=>Math.round(A[i]+(B[i]-A[i])*t);return'#'+[f(0),f(1),f(2)].map(v=>v.toString(16).padStart(2,'0')).join('');}
function shadeHex(h,k){return k<0?mixHex(h,'#140c18',-k):mixHex(h,'#ffffff',k);}
function RAMP(cols,out){return{c:cols.map(P),hex:cols,o:P(out||mixHex(cols[0],'#120a14',0.55))};}
class PS{
  constructor(w,h,s=1){this.w=w;this.h=h;this.s=s;this.col=new Uint32Array(w*h);this.out=new Uint32Array(w*h);this.T=[];this.ang=0;this.L=[-0.5,-0.72,0.48];}
  push(cx,cy,deg){const a=deg*Math.PI/180;this.T.push({cx,cy,c:Math.cos(a),s:Math.sin(a),d:deg});this.ang+=deg;return this;}
  pop(){const t=this.T.pop();this.ang-=t.d;return this;}
  toL(px,py){let x=px/this.s,y=py/this.s;for(let i=0;i<this.T.length;i++){const t=this.T[i];const dx=x-t.cx,dy=y-t.cy;x=t.cx+dx*t.c+dy*t.s;y=t.cy-dx*t.s+dy*t.c;}return[x,y];}
  toS(x,y){for(let i=this.T.length-1;i>=0;i--){const t=this.T[i];const dx=x-t.cx,dy=y-t.cy;x=t.cx+dx*t.c-dy*t.s;y=t.cy+dx*t.s+dy*t.c;}return[x*this.s,y*this.s];}
  light(extra=0){const a=-(this.ang+extra)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);const[lx,ly,lz]=this.L;return[lx*c-ly*s,lx*s+ly*c,lz];}
  bbox(x0,y0,x1,y1){const pts=[this.toS(x0,y0),this.toS(x1,y0),this.toS(x0,y1),this.toS(x1,y1)];let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of pts){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]);}return[Math.max(0,Math.floor(a)-1),Math.max(0,Math.floor(b)-1),Math.min(this.w-1,Math.ceil(c)+1),Math.min(this.h-1,Math.ceil(d)+1)];}
  // generic fill: inside(lx,ly)->info|null ; color(info,px,py)->packed|0
  fill(bb,inside,color,R,edge){const[x0,y0,x1,y1]=this.bbox(...bb);const bw=x1-x0+1,bh=y1-y0+1;if(bw<=0||bh<=0)return;const m=new Uint8Array(bw*bh);
    for(let py=y0;py<=y1;py++)for(let px=x0;px<=x1;px++){const l=this.toL(px+.5,py+.5);const inf=inside(l[0],l[1]);if(inf===null||inf===false)continue;const c=color(inf,px,py,l);if(!c)continue;const i=py*this.w+px;this.col[i]=c;this.out[i]=R?R.o:c;m[(py-y0)*bw+(px-x0)]=1;}
    if(edge){const ec=edge===true?R.c[0]:edge;const set=[];for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){if(!m[y*bw+x])continue;if(x===0||y===0||x===bw-1||y===bh-1||!m[y*bw+x-1]||!m[y*bw+x+1]||!m[(y-1)*bw+x]||!m[(y+1)*bw+x])set.push((y+y0)*this.w+x+x0);}for(const i of set)this.col[i]=ec;}
  }
  sh(R,i,px,py,o){const n=R.c.length;let t=(i+0.42)/1.42+(o.lift||0);t=Math.max(0,Math.min(1,t));let v=t*(n-1)+BAYER[(py&3)*4+(px&3)]*(o.dith===undefined?0.4:o.dith);let k=Math.round(v);if(o.min!==undefined)k=Math.max(o.min,k);if(o.max!==undefined)k=Math.min(o.max,k);return k<0?0:k>=n?n-1:k;}
  ell(cx,cy,rx,ry,R,o={}){const rot=(o.rot||0)*Math.PI/180,c=Math.cos(rot),s=Math.sin(rot);const L=this.light(o.rot||0);const r=Math.max(rx,ry);
    this.fill([cx-r,cy-r,cx+r,cy+r],(x,y)=>{const dx=x-cx,dy=y-cy;const u=(dx*c+dy*s)/rx,v=(-dx*s+dy*c)/ry;const d=u*u+v*v;if(d>1)return null;return[u,v,d];},
      (f,px,py,l)=>{if(o.flat!==undefined)return typeof o.flat==='number'&&o.flat<64?R.c[o.flat]:o.flat;const nz=Math.sqrt(Math.max(0,1-f[2]));const i=f[0]*L[0]+f[1]*L[1]+nz*L[2];const k=this.sh(R,i,px,py,o);return o.fn?o.fn(k,f,l,px,py):R.c[k];},R,o.edge);return this;}

// ---------- Gap placement: band shuffle-bag + rejection rules (fair, varied, always clearable) ----------
// Bands split the safe range [lo,hi] into 5 equal slices; a shuffled bag guarantees every band appears every 5 gaps.
// Rejection: consecutive gaps must differ by >= minStep, never by more than maxJump (proven clearable by tools/sim.js),
// and no three in a row may sit in a similar band (all within simBand of each other).
function makeGapGen(lo,hi,rnd=Math.random,o={}){const NB=5,bw=(hi-lo)/NB,minStep=o.minStep||34,maxJump=o.maxJump||(hi-lo),simBand=o.simBand||48;let bag=[],hist=[];
 const refill=()=>{bag=[...Array(NB).keys()];for(let i=NB-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}};
 const ok=(c)=>{const n=hist.length;if(!n)return true;const p=hist[n-1];const d=Math.abs(c-p);if(d<minStep||d>maxJump)return false;if(n>=2){const q=hist[n-2];if(Math.max(c,p,q)-Math.min(c,p,q)<simBand)return false;}return true;};
 return{reset(seed){bag=[];hist=seed===undefined?[]:[seed];},next(){let c=null;for(let tries=0;tries<40&&c===null;tries++){if(!bag.length)refill();
   // try bands from the bag in order; take the first band that can host a valid gap
   for(let k=0;k<bag.length&&c===null;k++){const b=bag[k];for(let s=0;s<6;s++){const v=Math.round(lo+(b+rnd())*bw);if(ok(v)){c=v;bag.splice(k,1);break;}}}
   if(c===null)bag=[];}
  if(c===null){const p=hist.length?hist[hist.length-1]:(lo+hi)/2;c=Math.round(p<(lo+hi)/2?Math.min(hi,p+Math.max(minStep,bw*2)):Math.max(lo,p-Math.max(minStep,bw*2)));}
  hist.push(c);if(hist.length>3)hist.shift();return c;}};}
if(typeof module!=='undefined')module.exports={makeGapGen};

// heroCall(ctx, destination, startTime, heroId, noiseBuffer) works with AudioContext and OfflineAudioContext.
function heroCall(c,dest,t,id,nb){

 const env=(g,a,peak,hold,rel)=>{g.gain.setValueAtTime(0.0001,t+a);g.gain.exponentialRampToValueAtTime(peak,t+a+0.015);g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+rel);};

 const filt=(type,f,q)=>{const b=c.createBiquadFilter();b.type=type;b.frequency.setValueAtTime(f,t);b.Q.value=q||1;return b;};
 const lfo=(rate,depth,param,type='sine')=>{const l=osc(type,rate),g=c.createGain();g.gain.value=depth;l.connect(g);g.connect(param);l.start(t);l.stop(t+0.6);return l;};
 const noise=(dur,vol,f,type,q,at=0)=>{if(!nb)return;const s=c.createBufferSource();s.buffer=nb;const b=filt(type,f,q),g=c.createGain();env(g,at,vol,dur*0.3,dur*0.7);s.connect(b);b.connect(g);g.connect(out);s.start(t+at);s.stop(t+at+dur+0.05);};
 if(id==='turkey'){ // gobble: warbling nasal tone, amplitude chopped at ~26 Hz, pitch falling
  const o=osc('sawtooth',720),o2=osc('triangle',1440);o.frequency.exponentialRampToValueAtTime(470,t+0.3);o2.frequency.exponentialRampToValueAtTime(940,t+0.3);
  lfo(26,90,o.frequency);const f1=filt('bandpass',1150,2.2),f2=filt('lowpass',2600,0.7);const g=c.createGain(),g2=c.createGain();g2.gain.value=0.35;
  const am=c.createGain();am.gain.value=0.55;lfo(26,0.45,am.gain,'triangle');
  o.connect(f1);o2.connect(g2);g2.connect(f1);f1.connect(f2);f2.connect(am);am.connect(g);g.connect(out);env(g,0,0.3,0.2,0.11);o.start(t);o2.start(t);o.stop(t+0.4);o2.stop(t+0.4);}
 else if(id==='pig'){ // oink-oink: two short nasal grunts with a scoop up then down
  [[0,0.12,1],[0.15,0.13,0.85]].forEach(([at,d,v])=>{const o=osc('sawtooth',190);o.frequency.setValueAtTime(190,t+at);o.frequency.linearRampToValueAtTime(290,t+at+d*0.35);o.frequency.exponentialRampToValueAtTime(170,t+at+d);

  [[0,0.11,560,640,0.8],[0.12,0.17,760,620,1]].forEach(([at,d,f0,f1,v])=>{const o=osc('square',f0);o.frequency.setValueAtTime(f0,t+at);o.frequency.exponentialRampToValueAtTime(f1,t+at+d);lfo(17,14,o.frequency);
   const f=filt('bandpass',1300,2.5),lp=filt('lowpass',2400,0.7);const g=c.createGain();env(g,at,0.62*v,d*0.5,d*0.5);o.connect(f);f.connect(lp);lp.connect(g);g.connect(out);o.start(t+at);o.stop(t+at+d+0.05);});}

function gameHTML(){return `
<div class="uf" id="uf">
 <div class="stage" id="uf-stage" tabindex="0" aria-label="Unlikely Flyers game. Press Space, click, or tap to flap."><canvas id="uf-canvas"></canvas></div>
 <div class="hud">
  <div class="topbar"><a class="chip" href="#/" id="uf-back">${ICON.back}<span>Arcade</span></a><div class="tb-r"><button class="chip icon" data-sound type="button" aria-label="Sound on">${ICON.snd}</button><button class="chip icon" id="uf-fs" type="button" aria-label="Full screen">${ICON.fs}</button></div></div>
  <div class="score" id="uf-score">0</div>
  <div class="hint" id="uf-hint"><span class="tap"></span>Tap, click, or press Space to flap</div>
  <div class="panel" id="uf-menu" role="dialog" aria-label="Choose your hero"><p class="num">Game 01</p><h2 class="title">Unlikely Flyers</h2><p class="sub">Choose your hero. Every flyer gets the same fair wings.</p><div class="tiles" id="uf-tiles"></div><button class="btn primary wide" id="uf-start" type="button">Start flying</button><p class="meta">Personal best <b id="uf-menu-best">0</b></p></div>
  <div class="panel" id="uf-over" role="dialog" aria-label="Round over"><p class="num">Round over</p><h2 class="title">Grounded!</h2><div class="ribbon-box" id="uf-ribbon"></div><div class="stats"><div><span>Score</span><strong id="uf-final">0</strong></div><div><span>Personal best</span><strong id="uf-best">0</strong></div></div><p class="newbest" id="uf-newbest">New personal best</p>
   <div class="row"><button class="btn primary" id="uf-again" type="button">Fly again</button><button class="btn ghost" id="uf-change" type="button">Change hero</button></div><div class="swap" id="uf-swap"><div class="tiles mini" id="uf-tiles2"></div></div></div>
 </div>
</div>`;}
let ROUTE=null,raf=0,last=0,hubStage=null,gameStage=null,hubT=0,thumbStage=null;
function drawThumbUF(){const c=$('#thumb-uf');if(!c)return;thumbStage=new Stage(c);const st=thumbStage,g=st.begin(),W=st.W;const m=moodAt(0.3);drawBackdrop(g,W,600,0);drawMood(g,W,m,WH);
 [[0.2,200],[0.5,140],[0.8,215]].forEach(([fx,gt],i)=>drawPillar(g,W*fx-PW/2,gt,gt+PHYS.GAP,i*0.4,m.glow));
 drawGround(g,W,600);heroShadow(g,W*0.36,262);drawHero(g,'turkey',W*0.36,262,-10,2.2);st.present();}
function hubRender(dt){hubT+=dt;const st=hubStage,g=st.begin(),W=st.W;const cam=hubT*60;const m=moodAt(0);drawBackdrop(g,W,cam,hubT);
 const sp=PHYS.SPACING*1.6;const off=cam%sp;for(let x=W*0.62-off;x<W+CAPW;x+=sp){if(x<-CAPW)continue;const k=Math.round((x+cam)/sp);const c=210+((k*53)%3-1)*16;drawPillar(g,x,c-118,c+118,hubT,0.4);}
 drawGround(g,W,cam);
 const ids=['turkey','pig','penguin','bull'];const narrow=W<700;ids.forEach((id,i)=>{const fx=narrow?[0.22,0.72,0.3,0.78][i]:[0.42,0.58,0.72,0.88][i];const fy=narrow?[120,150,250,280][i]:[170,250,175,250][i];const x=W*fx+Math.sin(hubT*0.7+i)*10;const y=fy+Math.sin(hubT*2.1+i*1.4)*10;heroShadow(g,x,y);drawHero(g,id,x,y,Math.cos(hubT*2.1+i*1.4)*-6,hubT*7+i*1.7);});st.present();}
function frameLoop(ts){raf=requestAnimationFrame(frameLoop);const dt=Math.min(0.05,last?(ts-last)/1000:0.016);last=ts;
 if(ROUTE==='hub'&&hubStage){hubRender(dt);}
 else if(ROUTE==='game'&&gameStage){UF.update(dt);UF.render();UI.animTiles(UF.t);}}
function go(){const h=location.hash||'#/';const route=h.startsWith('#/unlikely-flyers')?'game':'hub';if(h==='#lineup'){return;}if(route===ROUTE)return;ROUTE=route;const app=$('#app');document.documentElement.classList.toggle('in-game',route==='game');
 if(route==='hub'){gameStage=null;app.innerHTML=hubHTML();hubStage=new Stage($('#hub-canvas'));drawThumbUF();$('#farm-img').src=ASSET_SRC.farm;$('#see-lineup').addEventListener('click',e=>{e.preventDefault();$('#lineup').scrollIntoView({behavior:'smooth'});});window.scrollTo(0,0);}
 else{hubStage=null;app.innerHTML=gameHTML();gameStage=new Stage($('#uf-canvas'));UF.st=gameStage;wireGame();UI.menu();}
 for(const b of document.querySelectorAll('[data-sound]'))b.addEventListener('click',e=>{e.stopPropagation();Sound.ensure();Sound.toggle();setSoundLabels();});setSoundLabels();}
function wireGame(){const stage=$('#uf-stage');const act=e=>{if(e.target.closest('button,a,.panel'))return;e.preventDefault();Sound.ensure();if(UF.state==='ready'||UF.state==='play')UF.flap();};
 $('#uf').addEventListener('pointerdown',act);
 $('#uf-start').addEventListener('click',e=>{e.stopPropagation();UI.start();});
 $('#uf-again').addEventListener('click',e=>{e.stopPropagation();Sound.click();UI.start();});
 $('#uf-change').addEventListener('click',e=>{e.stopPropagation();Sound.click();$('#uf-swap').classList.toggle('open');});
 const fsb=$('#uf-fs');const el=document.documentElement;if(!(el.requestFullscreen||el.webkitRequestFullscreen))fsb.style.display='none';
 fsb.addEventListener('click',e=>{e.stopPropagation();const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}else{(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}});
 $('#uf-back').addEventListener('pointerdown',e=>e.stopPropagation());}
document.addEventListener('keydown',e=>{if(ROUTE!=='game')return;const k=e.code;if(k==='Space'||k==='ArrowUp'||k==='KeyW'||k==='Enter'){if(e.target.closest&&e.target.closest('button')&&k!=='Space'&&k!=='ArrowUp'&&k!=='KeyW')return;
  if(UF.state==='ready'||UF.state==='play'){e.preventDefault();Sound.ensure();UF.flap();}
  else if(UF.state==='menu'){if(e.target.closest&&e.target.closest('.tile')&&k!=='Enter')return;e.preventDefault();UI.start();}
  else if(UF.state==='over'&&performance.now()-UF.overAt>450){if(e.target.closest&&e.target.closest('#uf-change,.tile'))return;e.preventDefault();UI.start();}}
 else if(k==='Escape'&&UF.state!=='menu'&&UF.state!=='play'){UI.menu();}});
function onResize(){if(hubStage)hubStage.resize();if(gameStage)gameStage.resize();if(thumbStage&&ROUTE==='hub'&&thumbStage.resize())drawThumbUF();}
window.addEventListener('resize',onResize);window.addEventListener('orientationchange',()=>setTimeout(onResize,120));if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>{if(ROUTE==='game')e.preventDefault();});
document.addEventListener('touchmove',e=>{if(ROUTE==='game')e.preventDefault();},{passive:false});
window.addEventListener('hashchange',go);loadAssets().then(()=>{document.documentElement.classList.add('ready');go();raf=requestAnimationFrame(frameLoop);});
window.__mg={UF,UI,PHYS,go};

</script></body></html>
